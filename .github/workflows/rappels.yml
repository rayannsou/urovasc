name: Rappels
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency: rappels
jobs:
  envoi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --no-audit --no-fund firebase-admin@12
      - run: node scripts/rappels.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
